<app-navbar title ="The Movie Vault"></app-navbar>

<ion-content [fullscreen]="true">

  <!-- ID sub-title -->
  <div class="student-info">
    <p>Joseph Harrison &middot; G00485510</p>
  </div>

  <!-- Search box, bound to searchTerm so typing updates the property and fires when the user submits -->
  <ion-searchbar [(ngModel)]="searchTerm" (search)="search()" placeholder="Search for a movie">
  </ion-searchbar>

  <!-- Search button, runs search() when clicked -->
  <ion-button (click)="search()" expand="block">SEARCH</ion-button>

  <!-- Heading above the list -->
  <h2 class="section-title">{{ heading }}</h2>

  <!-- Repeats the block once for each element of the movies array -->
  @for (movie of movies; track movie.id) {
  <ion-card button (click)="openMovie(movie.id)">

    <!-- Poster image acquired via image URL to TMDB -->
    <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" [alt]="movie.title" />

    <ion-card-header>
      <ion-card-title>{{ movie.title }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      {{ movie.overview }}
    </ion-card-content>

  </ion-card>
  }

</ion-content>
